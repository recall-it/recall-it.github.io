    // --- CONFIG ---

    const codeLengths = {
      easy: 5,
      intermediate: 7,
      hard: 10

    const times = {
      easy: 5,
      intermediate: 3,
      hard: 1
    };

    const wordPools = {
      easy: [
        "flame", "crisp", "vivid", "shard", "lunar", "prism", "ember"
      ], // 5 letters

        "crystal", "shimmer", "radiant", "horizon", "spectra", "velvety", "amplify"

    let currentAnswer = "";
    let currentTimer = null;
    let timeLeft = 0;

        out += chars[Math.floor(Math.random() * chars.length)];
      }
      return out;

      return randomFromArray(pool);

        timeLeft -= 0.1;
        if (timeLeft <= 0) {
          clearInterval(currentTimer);
          timerLabel.textContent = "Time: 0.0s";
          onEnd();
        } else {
          timerLabel.textContent = "Time: " + timeLeft.toFixed(1) + "s";
        }

<!DOCTYPE html>

    @media (max-width: 520px) {

      .settings {

      .display-box {

      }

</head>

<body>

  <div class="background-glow"></div>

  <div class="game">

    <div class="top">
      <div class="title-wrap">
        <h1>🧠 Memory Challenge</h1>
        <p>Test your short-term memory speed.</p>
      </div>

      <div class="score-badge">
        <span>SCORE</span>
        <strong id="scoreText">0</strong>
      </div>
    </div>

    <div class="settings">
      <div class="field">
        <label>Mode</label>

        <select id="modeSelect">
          <option value="code">Random Code</option>
          <option value="words">Words</option>
        </select>
      </div>

      <div class="field">
        <label>Difficulty</label>

        <select id="difficultySelect">
          <option value="easy">Easy</option>
          <option value="intermediate">Intermediate</option>
          <option value="hard">Hard</option>
        </select>
      </div>
    </div>

    <button class="primary-btn" id="startBtn">
      Start Challenge
    </button>

    <div class="display-box" id="displayArea">
      Ready?
    </div>

    <div class="stats">
      <span id="timerLabel">⏱ Time: -</span>
      <span id="lengthLabel">🔢 Length: -</span>
    </div>

    <div class="input-row">
      <input
        id="answerInput"
        type="text"
        placeholder="Type what you remember..."
        autocomplete="off"
        disabled
      />

      <button
        class="submit-btn"
        id="submitBtn"
        disabled
      >
        Submit
      </button>
    </div>

    <div class="result" id="resultText"></div>

    <div class="hint">
      Press ENTER to submit faster ⚡
    </div>

  </div>

  <script>
    // ---------------- CONFIG ----------------

    const codeLengths = {
      easy: 5,
      intermediate: 7,
      hard: 10
    };

    const times = {
      easy: 5,
      intermediate: 3,
      hard: 1.5
    };

    const wordPools = {
      easy: [
        "flame",
        "crisp",
        "vivid",
        "shard",
        "lunar",
        "prism",
        "ember"
      ],

      intermediate: [
        "crystal",
        "shimmer",
        "radiant",
        "horizon",
        "spectra",
        "velvety",
        "amplify"
      ],

      hard: [
        "luminosity",
        "reflection",
        "stargazers",
        "afterglow",
        "resonating",
        "spellbound"
      ]
    };

    const chars =
      "abcdefghijklmnopqrstuvwxyz0123456789";

    // ---------------- STATE ----------------

    let currentAnswer = "";
    let currentTimer = null;
    let timeLeft = 0;
    let score = 0;
    let showingPhase = false;

    // ---------------- ELEMENTS ----------------

    const modeSelect =
      document.getElementById("modeSelect");

    const difficultySelect =
      document.getElementById("difficultySelect");

    const startBtn =
      document.getElementById("startBtn");

    const displayArea =
      document.getElementById("displayArea");

    const timerLabel =
      document.getElementById("timerLabel");

    const lengthLabel =
      document.getElementById("lengthLabel");

    const answerInput =
      document.getElementById("answerInput");

    const submitBtn =
      document.getElementById("submitBtn");

    const resultText =
      document.getElementById("resultText");

    const scoreText =
      document.getElementById("scoreText");

    // ---------------- HELPERS ----------------

    function randomFromArray(arr) {
      return arr[
        Math.floor(Math.random() * arr.length)
      ];
    }

    function generateCode(length) {
      let output = "";

      for (let i = 0; i < length; i++) {
        output += chars[
          Math.floor(Math.random() * chars.length)
        ];
      }

      return output;
    }

    function generateWord(difficulty) {
      return randomFromArray(
        wordPools[difficulty]
      );
    }

    function setTimer(seconds, onEnd) {
      clearInterval(currentTimer);

      timeLeft = seconds;

      updateTimer();

      currentTimer = setInterval(() => {
        timeLeft -= 0.1;

        if (timeLeft <= 0) {
          clearInterval(currentTimer);

          timerLabel.textContent =
            "⏱ Time: 0.0s";

          onEnd();

          return;
        }

        updateTimer();

      }, 100);
    }

    function updateTimer() {
      timerLabel.textContent =
        `⏱ Time: ${timeLeft.toFixed(1)}s`;
    }

    function resetUI() {

      answerInput.value = "";

      answerInput.disabled = true;
      submitBtn.disabled = true;

      resultText.textContent = "";
      resultText.className = "result";

      timerLabel.textContent =
        "⏱ Time: -";

      lengthLabel.textContent =
        "🔢 Length: -";
    }

    function flashResult(type) {
      resultText.classList.remove(
        "correct",
        "wrong"
      );

      void resultText.offsetWidth;

      resultText.classList.add(type);
    }

    // ---------------- GAME ----------------

    startBtn.addEventListener("click", () => {

      resetUI();

      const mode = modeSelect.value;
      const difficulty =
        difficultySelect.value;

      const length =
        codeLengths[difficulty];

      const showTime =
        times[difficulty];

      let generated;

      if (mode === "code") {
        generated = generateCode(length);
      } else {
        generated = generateWord(difficulty);
      }

      currentAnswer = generated;

      displayArea.textContent = generated;

      lengthLabel.textContent =
        `🔢 Length: ${generated.length}`;

      showingPhase = true;

      resultText.textContent =
        "Memorise it carefully 👀";

      setTimer(showTime, () => {

        displayArea.textContent = "•••••";

        showingPhase = false;

        answerInput.disabled = false;
        submitBtn.disabled = false;

        answerInput.focus();

        resultText.textContent =
          "Now type what you remember ✍️";

        timerLabel.textContent =
          "⏱ Time: Done";
      });
    });

    submitBtn.addEventListener("click", () => {

      if (
        showingPhase ||
        !currentAnswer
      ) return;

      const userInput =
        answerInput.value.trim();

      if (!userInput) return;

      if (
        userInput.toLowerCase() ===
        currentAnswer.toLowerCase()
      ) {

        score += 100;

        resultText.textContent =
          "✔️ Correct! +100 points";

        flashResult("correct");

      } else {

        resultText.textContent =
          `❌ Wrong! Answer: ${currentAnswer}`;

        flashResult("wrong");
      }

      scoreText.textContent = score;

      answerInput.disabled = true;
      submitBtn.disabled = true;
    });

    answerInput.addEventListener(
      "keydown",
      (e) => {

        if (e.key === "Enter") {
          submitBtn.click();
        }
      }
    );
  </script>

</body>
