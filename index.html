<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>ReCall It! Ultimate</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {

      --gradient:

        linear-gradient(
          135deg,

          #ff3b30,
          #ff9500,
          #ffd60a,
          #32d74b,
          #00c7be,
          #64d2ff,
          #0a84ff,
          #bf5af2,
          #ff2d92,
          #ff375f
        );

      --bg-1: #020617;
      --bg-2: #0f172a;

      --card:
        rgba(15, 23, 42, 0.84);

      --text: #f8fafc;

      --muted: #94a3b8;

      --success: #32d74b;

      --danger: #ff453a;
    }

    body {

      min-height: 100vh;

      font-family:
        Inter,
        system-ui,
        sans-serif;

      background:

        radial-gradient(
          circle at top left,
          rgba(255, 59, 48, 0.25),
          transparent 30%
        ),

        radial-gradient(
          circle at bottom right,
          rgba(191, 90, 242, 0.22),
          transparent 30%
        ),

        linear-gradient(
          135deg,
          var(--bg-1),
          var(--bg-2)
        );

      color: var(--text);

      overflow-x: hidden;

      padding: 30px;
    }

    .app {

      width: 100%;
      max-width: 1500px;

      margin: auto;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 30px;
    }

    /* =========================
       SIDEBAR
    ========================= */

    .sidebar {

      width: 320px;

      display: flex;
      flex-direction: column;

      gap: 24px;
    }

    .sidebar-card {

      background:
        var(--card);

      border:
        1px solid rgba(255,255,255,0.08);

      border-radius: 30px;

      padding: 24px;

      backdrop-filter: blur(20px);

      box-shadow:
        0 10px 50px rgba(0,0,0,0.35);
    }

    .sidebar-card h2 {

      margin-bottom: 18px;

      font-size: 1.2rem;

      background: var(--gradient);

      background-size: 300%;

      -webkit-background-clip: text;

      -webkit-text-fill-color: transparent;

      animation:
        rainbow 6s linear infinite;
    }

    @keyframes rainbow {

      0% {
        background-position: 0%;
      }

      100% {
        background-position: 300%;
      }
    }

    .leaderboard-item {

      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 14px 16px;

      margin-bottom: 12px;

      border-radius: 18px;

      background:
        rgba(255,255,255,0.05);

      border:
        1px solid rgba(255,255,255,0.05);
    }

    .leaderboard-left {

      display: flex;
      align-items: center;
      gap: 12px;
    }

    .rank {

      width: 34px;
      height: 34px;

      border-radius: 12px;

      background: var(--gradient);

      background-size: 400%;

      animation:
        rainbow 5s linear infinite;

      display: flex;
      justify-content: center;
      align-items: center;

      font-weight: 800;
    }

    .leaderboard-name {

      font-weight: 700;
    }

    .leaderboard-score {

      color: #64d2ff;

      font-weight: 700;
    }

    /* =========================
       GAME
    ========================= */

    .game {

      width: 100%;
      max-width: 520px;

      position: relative;

      padding: 34px;

      border-radius: 34px;

      background:
        var(--card);

      border:
        1px solid rgba(255,255,255,0.08);

      backdrop-filter: blur(20px);

      box-shadow:
        0 20px 60px rgba(0,0,0,0.45);
    }

    .top-bar {

      display: flex;
      justify-content: space-between;
      align-items: flex-start;

      margin-bottom: 30px;
    }

    .title h1 {

      font-size: 2.5rem;
      font-weight: 900;

      line-height: 1.1;

      background: var(--gradient);

      background-size: 300%;

      -webkit-background-clip: text;

      -webkit-text-fill-color: transparent;

      animation:
        rainbow 6s linear infinite;
    }

    .subtitle {

      margin-top: 8px;

      color: var(--muted);

      font-size: 0.95rem;
    }

    .top-buttons {

      display: flex;
      gap: 10px;
      flex-wrap: wrap;

      justify-content: flex-end;
    }

    .small-btn {

      border: none;

      padding: 12px 14px;

      border-radius: 16px;

      cursor: pointer;

      font-weight: 700;

      color: white;

      background:
        rgba(255,255,255,0.08);

      transition: 0.25s;
    }

    .small-btn:hover {

      transform: translateY(-2px);

      background:
        rgba(255,255,255,0.14);
    }

    .score-box {

      margin-top: 20px;

      background: var(--gradient);

      background-size: 400%;

      animation:
        rainbow 6s linear infinite;

      padding: 18px;

      border-radius: 24px;

      text-align: center;

      box-shadow:
        0 12px 30px rgba(0,0,0,0.35);
    }

    .score-box span {

      display: block;

      font-size: 0.85rem;

      margin-bottom: 4px;
    }

    .score-box strong {

      font-size: 2rem;
      font-weight: 900;
    }

    .daily-reward {

      margin-top: 18px;

      padding: 16px;

      border-radius: 20px;

      text-align: center;

      background:
        rgba(255,255,255,0.05);

      border:
        1px solid rgba(255,255,255,0.08);
    }

    .daily-reward button {

      margin-top: 12px;

      width: 100%;

      padding: 14px;

      border: none;

      border-radius: 16px;

      cursor: pointer;

      font-weight: 800;

      color: white;

      background: var(--gradient);

      background-size: 400%;

      animation:
        rainbow 6s linear infinite;
    }

    .row {

      display: flex;

      gap: 16px;

      margin-top: 22px;
    }

    .field {
      flex: 1;
    }

    .label {

      display: block;

      margin-bottom: 8px;

      color: var(--muted);

      font-size: 0.9rem;

      font-weight: 700;
    }

    select,
    input {

      width: 100%;

      padding: 15px;

      border-radius: 18px;

      border:
        1px solid rgba(255,255,255,0.08);

      background:
        rgba(255,255,255,0.05);

      color: white;

      font-size: 1rem;

      outline: none;
    }

    select option {
      background: #111827;
    }

    .main-btn {

      width: 100%;

      margin-top: 22px;

      padding: 17px;

      border: none;

      border-radius: 22px;

      cursor: pointer;

      font-size: 1rem;
      font-weight: 900;

      color: white;

      background: var(--gradient);

      background-size: 400%;

      animation:
        rainbow 6s linear infinite;

      transition: 0.25s;
    }

    .main-btn:hover {

      transform: translateY(-2px);
    }

    .display-box {

      height: 135px;

      margin-top: 24px;

      border-radius: 30px;

      display: flex;
      justify-content: center;
      align-items: center;

      font-size: 2.3rem;
      font-weight: 900;

      letter-spacing: 4px;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.08),
          rgba(255,255,255,0.03)
        );

      border:
        1px solid rgba(255,255,255,0.08);
    }

    .info {

      margin-top: 18px;

      display: flex;
      justify-content: space-between;

      color: var(--muted);
    }

    .input-row {

      margin-top: 20px;

      display: flex;
      gap: 12px;
    }

    .submit-btn {

      padding: 0 26px;

      border-radius: 18px;

      border: none;

      cursor: pointer;

      font-weight: 800;

      color: white;

      background: var(--gradient);

      background-size: 400%;

      animation:
        rainbow 6s linear infinite;
    }

    .result {

      margin-top: 22px;

      min-height: 24px;

      text-align: center;

      font-weight: 800;
    }

    .correct {
      color: var(--success);
    }

    .wrong {
      color: var(--danger);
    }

    .party-box {

      display: flex;
      gap: 10px;

      margin-top: 14px;
    }

    .party-item {

      margin-top: 12px;

      padding: 14px;

      border-radius: 16px;

      background:
        rgba(255,255,255,0.05);

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .join-btn {

      padding: 8px 12px;

      border-radius: 12px;

      border: none;

      cursor: pointer;

      color: white;

      background: var(--gradient);

      background-size: 400%;

      animation:
        rainbow 6s linear infinite;
    }

    .footer {

      margin-top: 26px;

      text-align: center;

      color: var(--muted);

      font-size: 0.82rem;
    }

    @media (max-width: 1200px) {

      .app {

        flex-direction: column;
      }

      .sidebar {

        width: 100%;
        max-width: 520px;
      }
    }

    @media (max-width: 650px) {

      body {
        padding: 14px;
      }

      .row {
        flex-direction: column;
      }

      .top-bar {

        flex-direction: column;
        gap: 20px;
      }

      .top-buttons {
        width: 100%;
      }

      .display-box {
        font-size: 1.7rem;
      }
    }

  </style>

</head>

<body>

  <div class="app">

    <!-- =========================
         LEFT SIDEBAR
    ========================== -->

    <aside class="sidebar">

      <!-- LEADERBOARD -->

      <div class="sidebar-card">

        <h2>
          🏆 Global Leaderboard
        </h2>

        <div id="leaderboardList"></div>

      </div>

      <!-- PARTIES -->

      <div class="sidebar-card">

        <h2>
          🎉 Private Parties
        </h2>

        <div class="party-box">

          <input
            type="text"
            id="partyInput"
            placeholder="Party name..."
          />

          <button
            class="join-btn"
            id="createPartyBtn"
          >
            Create
          </button>

        </div>

        <div id="partyList"></div>

      </div>

    </aside>

    <!-- =========================
         MAIN GAME
    ========================== -->

    <main class="game">

      <div class="top-bar">

        <div class="title">

          <h1>
            🧠 ReCall It!
          </h1>

          <p class="subtitle">
            Ultimate Memory Challenge
          </p>

        </div>

        <div class="top-buttons">

          <button
            class="small-btn"
            id="usernameBtn"
          >
            👤 Guest
          </button>

          <button
            class="small-btn"
            id="themeBtn"
          >
            🎨 Theme
          </button>

          <button
            class="small-btn"
            id="logoutBtn"
          >
            🚪 Logout
          </button>

        </div>

      </div>

      <!-- SCORE -->

      <div class="score-box">

        <span>SCORE</span>

        <strong id="scoreText">
          0
        </strong>

      </div>

      <!-- DAILY REWARD -->

      <div class="daily-reward">

        🎁 Daily Login Reward:
        <strong>
          +50 Points
        </strong>

        <button id="claimRewardBtn">
          Claim Reward
        </button>

      </div>

      <!-- SETTINGS -->

      <div class="row">

        <div class="field">

          <label class="label">
            Mode
          </label>

          <select id="modeSelect">

            <option value="code">
              Random Code
            </option>

            <option value="words">
              Words
            </option>

          </select>

        </div>

        <div class="field">

          <label class="label">
            Difficulty
          </label>

          <select id="difficultySelect">

            <option value="easy">
              Easy
            </option>

            <option value="intermediate">
              Intermediate
            </option>

            <option value="hard">
              Hard
            </option>

          </select>

        </div>

      </div>

      <!-- START -->

      <button
        class="main-btn"
        id="startBtn"
      >
        Start Challenge
      </button>

      <!-- DISPLAY -->

      <div
        class="display-box"
        id="displayArea"
      >
        Ready?
      </div>

      <!-- INFO -->

      <div class="info">

        <span id="timerLabel">
          ⏱ Time: -
        </span>

        <span id="lengthLabel">
          🔢 Length: -
        </span>

      </div>

      <!-- INPUT -->

      <div class="input-row">

        <input
          id="answerInput"
          type="text"
          autocomplete="off"
          placeholder="Type what you remember..."
          disabled
        />

        <button
          id="submitBtn"
          class="submit-btn"
          disabled
        >
          Submit
        </button>

      </div>

      <!-- RESULT -->

      <div
        class="result"
        id="resultText"
      ></div>

      <div class="footer">
        Every correct answer = +1 Point ⚡
      </div>

    </main>

  </div>

  <script>

    // =========================
    // CONFIG
    // =========================

    const codeLengths = {

      easy: 5,
      intermediate: 7,
      hard: 10
    };

    const times = {

      easy: 5,
      intermediate: 3,
      hard: 1.5
    };

    const wordPools = {

      easy: [
        "flame",
        "crisp",
        "vivid",
        "shard",
        "lunar",
        "prism",
        "ember"
      ],

      intermediate: [
        "crystal",
        "shimmer",
        "radiant",
        "horizon",
        "spectra",
        "velvety",
        "amplify"
      ],

      hard: [
        "luminosity",
        "reflection",
        "stargazers",
        "afterglow",
        "resonating",
        "spellbound"
      ]
    };

    const chars =
      "abcdefghijklmnopqrstuvwxyz0123456789";

    // =========================
    // STATE
    // =========================

    let score = 0;

    let currentAnswer = "";

    let currentTimer = null;

    let timeLeft = 0;

    let showingPhase = false;

    let currentUser =
      localStorage.getItem("recall-user")
      || "Guest";

    // =========================
    // ELEMENTS
    // =========================

    const scoreText =
      document.getElementById("scoreText");

    const usernameBtn =
      document.getElementById("usernameBtn");

    const displayArea =
      document.getElementById("displayArea");

    const timerLabel =
      document.getElementById("timerLabel");

    const lengthLabel =
      document.getElementById("lengthLabel");

    const answerInput =
      document.getElementById("answerInput");

    const submitBtn =
      document.getElementById("submitBtn");

    const resultText =
      document.getElementById("resultText");

    const startBtn =
      document.getElementById("startBtn");

    const modeSelect =
      document.getElementById("modeSelect");

    const difficultySelect =
      document.getElementById("difficultySelect");

    const leaderboardList =
      document.getElementById("leaderboardList");

    const claimRewardBtn =
      document.getElementById("claimRewardBtn");

    const createPartyBtn =
      document.getElementById("createPartyBtn");

    const partyList =
      document.getElementById("partyList");

    // =========================
    // USER
    // =========================

    usernameBtn.textContent =
      `👤 ${currentUser}`;

    // =========================
    // HELPERS
    // =========================

    function randomFromArray(arr) {

      return arr[
        Math.floor(Math.random() * arr.length)
      ];
    }

    function generateCode(length) {

      let output = "";

      for (let i = 0; i < length; i++) {

        output += chars[
          Math.floor(Math.random() * chars.length)
        ];
      }

      return output;
    }

    function generateWord(difficulty) {

      return randomFromArray(
        wordPools[difficulty]
      );
    }

    function updateTimer() {

      timerLabel.textContent =
        `⏱ Time: ${timeLeft.toFixed(1)}s`;
    }

    function setTimer(seconds, onEnd) {

      clearInterval(currentTimer);

      timeLeft = seconds;

      updateTimer();

      currentTimer = setInterval(() => {

        timeLeft -= 0.1;

        if (timeLeft <= 0) {

          clearInterval(currentTimer);

          onEnd();

          return;
        }

        updateTimer();

      }, 100);
    }

    // =========================
    // DAILY REWARD
    // =========================

    function checkDailyReward() {

      const today =
        new Date().toDateString();

      const lastClaim =
        localStorage.getItem(
          "reward-date"
        );

      if (today === lastClaim) {

        claimRewardBtn.disabled = true;

        claimRewardBtn.textContent =
          "Reward Claimed";
      }
    }

    claimRewardBtn.addEventListener(
      "click",
      () => {

        score += 50;

        scoreText.textContent =
          score;

        localStorage.setItem(
          "reward-date",
          new Date().toDateString()
        );

        claimRewardBtn.disabled = true;

        claimRewardBtn.textContent =
          "Reward Claimed";

        saveLeaderboard();
      }
    );

    checkDailyReward();

    // =========================
    // LEADERBOARD
    // =========================

    function saveLeaderboard() {

      let data =
        JSON.parse(
          localStorage.getItem(
            "recall-leaderboard"
          )
        ) || [];

      const existing =
        data.find(
          player =>
            player.name === currentUser
        );

      if (existing) {

        existing.score = score;

      } else {

        data.push({

          name: currentUser,
          score
        });
      }

      data.sort(
        (a, b) =>
          b.score - a.score
      );

      localStorage.setItem(
        "recall-leaderboard",
        JSON.stringify(data)
      );

      renderLeaderboard();
    }

    function renderLeaderboard() {

      let data =
        JSON.parse(
          localStorage.getItem(
            "recall-leaderboard"
          )
        ) || [];

      leaderboardList.innerHTML = "";

      data.slice(0, 10).forEach(
        (player, index) => {

          leaderboardList.innerHTML += `

            <div class="leaderboard-item">

              <div class="leaderboard-left">

                <div class="rank">
                  ${index + 1}
                </div>

                <div class="leaderboard-name">
                  ${player.name}
                </div>

              </div>

              <div class="leaderboard-score">
                ${player.score}
              </div>

            </div>

          `;
        }
      );
    }

    renderLeaderboard();

    // =========================
    // PARTIES
    // =========================

    function renderParties() {

      const parties =
        JSON.parse(
          localStorage.getItem(
            "recall-parties"
          )
        ) || [];

      partyList.innerHTML = "";

      parties.forEach(
        party => {

          partyList.innerHTML += `

            <div class="party-item">

              <span>
                🎮 ${party}
              </span>

              <button class="join-btn">
                Join
              </button>

            </div>

          `;
        }
      );
    }

    createPartyBtn.addEventListener(
      "click",
      () => {

        const input =
          document.getElementById(
            "partyInput"
          );

        const value =
          input.value.trim();

        if (!value) return;

        let parties =
          JSON.parse(
            localStorage.getItem(
              "recall-parties"
            )
          ) || [];

        parties.push(value);

        localStorage.setItem(
          "recall-parties",
          JSON.stringify(parties)
        );

        input.value = "";

        renderParties();
      }
    );

    renderParties();

    // =========================
    // GAME
    // =========================

    startBtn.addEventListener(
      "click",
      () => {

        const mode =
          modeSelect.value;

        const difficulty =
          difficultySelect.value;

        const length =
          codeLengths[difficulty];

        const showTime =
          times[difficulty];

        let generated = "";

        if (mode === "code") {

          generated =
            generateCode(length);

        } else {

          generated =
            generateWord(difficulty);
        }

        currentAnswer =
          generated;

        showingPhase = true;

        displayArea.textContent =
          generated;

        lengthLabel.textContent =
          `🔢 Length: ${generated.length}`;

        resultText.textContent =
          "Memorise it 👀";

        answerInput.value = "";

        answerInput.disabled = true;

        submitBtn.disabled = true;

        setTimer(showTime, () => {

          displayArea.textContent =
            "•••••";

          showingPhase = false;

          answerInput.disabled = false;

          submitBtn.disabled = false;

          answerInput.focus();

          timerLabel.textContent =
            "⏱ Done";

          resultText.textContent =
            "Type it ✍️";
        });
      }
    );

    // =========================
    // SUBMIT
    // =========================

    submitBtn.addEventListener(
      "click",
      () => {

        if (
          showingPhase ||
          !currentAnswer
        ) return;

        const userInput =
          answerInput.value.trim();

        if (!userInput) return;

        if (
          userInput.toLowerCase() ===
          currentAnswer.toLowerCase()
        ) {

          score += 1;

          scoreText.textContent =
            score;

          resultText.textContent =
            "✔ Correct! +1 Point";

          resultText.className =
            "result correct";

          saveLeaderboard();

        } else {

          resultText.textContent =
            `❌ Wrong! ${currentAnswer}`;

          resultText.className =
            "result wrong";
        }

        answerInput.disabled = true;

        submitBtn.disabled = true;
      }
    );

    // =========================
    // ENTER
    // =========================

    answerInput.addEventListener(
      "keydown",
      e => {

        if (e.key === "Enter") {

          submitBtn.click();
        }
      }
    );

    // =========================
    // THEME BUTTON
    // =========================

    document.getElementById(
      "themeBtn"
    ).addEventListener(
      "click",
      () => {

        document.body.style.filter =
          `hue-rotate(${
            Math.floor(
              Math.random() * 360
            )
          }deg)`;
      }
    );

    // =========================
    // LOGOUT
    // =========================

    document.getElementById(
      "logoutBtn"
    ).addEventListener(
      "click",
      () => {

        localStorage.removeItem(
          "recall-user"
        );

        location.reload();
      }
    );

  </script>

</body>
</html>
