<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Memory Challenge</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {

      --bg-1: #020617;
      --bg-2: #0f172a;

      --card: rgba(15, 23, 42, 0.82);

      --primary: #8b5cf6;
      --primary-2: #9333ea;

      --cyan: #22d3ee;

      --text: #f8fafc;
      --muted: #94a3b8;

      --success: #22c55e;
      --danger: #fb7185;

    }

    body {

      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 30px;

      overflow: hidden;

      font-family:
        Inter,
        system-ui,
        Arial,
        sans-serif;

      background:

        radial-gradient(
          circle at top left,
          rgba(139, 92, 246, 0.25),
          transparent 30%
        ),

        radial-gradient(
          circle at bottom right,
          rgba(34, 211, 238, 0.18),
          transparent 30%
        ),

        linear-gradient(
          135deg,
          var(--bg-1),
          var(--bg-2)
        );

      color: var(--text);
    }

    .game {

      width: 100%;
      max-width: 470px;

      position: relative;

      padding: 32px;

      border-radius: 32px;

      backdrop-filter: blur(20px);

      background: var(--card);

      border:
        1px solid rgba(255,255,255,0.08);

      box-shadow:
        0 20px 60px rgba(0,0,0,0.45),
        0 0 80px rgba(139,92,246,0.15);

      overflow: hidden;
    }

    .game::before {

      content: "";

      position: absolute;

      width: 250px;
      height: 250px;

      background:
        radial-gradient(
          circle,
          rgba(139,92,246,0.22),
          transparent 70%
        );

      top: -120px;
      right: -120px;

      pointer-events: none;
    }

    .top {

      position: relative;

      margin-bottom: 28px;
    }

    h1 {

      font-size: 2.3rem;
      font-weight: 800;

      line-height: 1.1;

      margin-bottom: 10px;

      letter-spacing: -1px;
    }

    .subtitle {

      color: var(--muted);

      font-size: 0.96rem;

      width: 75%;
    }

    .score-box {

      position: absolute;

      top: 0;
      right: 0;

      width: 95px;
      height: 95px;

      border-radius: 24px;

      background:
        linear-gradient(
          135deg,
          var(--primary),
          var(--primary-2)
        );

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      box-shadow:
        0 12px 30px rgba(139,92,246,0.35);

      animation:
        glow 4s infinite ease-in-out;
    }

    @keyframes glow {

      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.03);
      }
    }

    .score-box span {

      font-size: 0.78rem;
      opacity: 0.9;

      margin-bottom: 4px;
    }

    .score-box strong {

      font-size: 1.5rem;
      font-weight: 800;
    }

    .row {

      display: flex;
      gap: 16px;

      margin-bottom: 18px;
    }

    .field {
      flex: 1;
    }

    .label {

      display: block;

      margin-bottom: 8px;

      color: var(--muted);

      font-size: 0.9rem;
      font-weight: 600;
    }

    select,
    input {

      width: 100%;

      padding: 15px 16px;

      border-radius: 18px;

      border:
        1px solid rgba(255,255,255,0.08);

      background:
        rgba(255,255,255,0.05);

      color: white;

      font-size: 1rem;

      outline: none;

      transition: 0.25s;
    }

    select:focus,
    input:focus {

      border-color:
        rgba(139,92,246,0.6);

      box-shadow:
        0 0 0 4px rgba(139,92,246,0.12);
    }

    select option {
      background: #111827;
    }

    button {

      border: none;

      cursor: pointer;

      transition: 0.25s;

      font-weight: 700;
    }

    .start-btn {

      width: 100%;

      padding: 16px;

      border-radius: 20px;

      margin-bottom: 26px;

      background:
        linear-gradient(
          135deg,
          var(--primary),
          var(--primary-2)
        );

      color: white;

      font-size: 1rem;

      box-shadow:
        0 12px 30px rgba(139,92,246,0.35);
    }

    .start-btn:hover {

      transform: translateY(-2px);

      filter: brightness(1.05);
    }

    .display-box {

      height: 125px;

      display: flex;
      justify-content: center;
      align-items: center;

      margin-bottom: 22px;

      border-radius: 30px;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.08),
          rgba(255,255,255,0.03)
        );

      border:
        1px solid rgba(255,255,255,0.08);

      font-size: 2.3rem;
      font-weight: 800;

      letter-spacing: 5px;

      position: relative;

      overflow: hidden;
    }

    .display-box::before {

      content: "";

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          120deg,
          transparent,
          rgba(255,255,255,0.08),
          transparent
        );

      transform: translateX(-100%);

      animation:
        shine 5s infinite;
    }

    @keyframes shine {

      100% {
        transform: translateX(200%);
      }
    }

    .info {

      display: flex;
      justify-content: space-between;

      margin-bottom: 20px;

      color: var(--muted);

      font-size: 0.95rem;
    }

    .input-row {

      display: flex;
      gap: 12px;
    }

    .submit-btn {

      padding: 0 24px;

      border-radius: 18px;

      background:
        linear-gradient(
          135deg,
          #06b6d4,
          #0891b2
        );

      color: white;
    }

    .submit-btn:hover {

      transform: translateY(-2px);
    }

    button:disabled {

      opacity: 0.45;

      cursor: not-allowed;

      transform: none !important;
    }

    .result {

      margin-top: 22px;

      text-align: center;

      min-height: 26px;

      font-size: 1rem;
      font-weight: 700;
    }

    .correct {

      color: var(--success);

      text-shadow:
        0 0 15px rgba(34,197,94,0.45);
    }

    .wrong {

      color: var(--danger);

      text-shadow:
        0 0 15px rgba(251,113,133,0.4);
    }

    .footer {

      margin-top: 28px;

      text-align: center;

      color: var(--muted);

      font-size: 0.82rem;
    }

    @media (max-width: 560px) {

      body {
        padding: 16px;
      }

      .game {
        padding: 24px;
      }

      .row {
        flex-direction: column;
      }

      .subtitle {
        width: 100%;
      }

      .score-box {

        position: static;

        margin-top: 18px;
      }

      .display-box {
        font-size: 1.7rem;
      }
    }

  </style>
</head>

<body>

  <div class="game">

    <div class="top">

      <h1>🧠 Memory Challenge</h1>

      <p class="subtitle">
        Test your short-term memory speed.
      </p>

      <div class="score-box">

        <span>SCORE</span>

        <strong id="scoreText">
          0
        </strong>

      </div>

    </div>

    <div class="row">

      <div class="field">

        <label class="label">
          Mode
        </label>

        <select id="modeSelect">

          <option value="code">
            Random Code
          </option>

          <option value="words">
            Words
          </option>

        </select>

      </div>

      <div class="field">

        <label class="label">
          Difficulty
        </label>

        <select id="difficultySelect">

          <option value="easy">
            Easy
          </option>

          <option value="intermediate">
            Intermediate
          </option>

          <option value="hard">
            Hard
          </option>

        </select>

      </div>

    </div>

    <button
      id="startBtn"
      class="start-btn"
    >
      Start Challenge
    </button>

    <div
      class="display-box"
      id="displayArea"
    >
      Ready?
    </div>

    <div class="info">

      <span id="timerLabel">
        ⏱ Time: -
      </span>

      <span id="lengthLabel">
        🔢 Length: -
      </span>

    </div>

    <div class="input-row">

      <input
        id="answerInput"
        type="text"
        autocomplete="off"
        placeholder="Type what you remember..."
        disabled
      />

      <button
        id="submitBtn"
        class="submit-btn"
        disabled
      >
        Submit
      </button>

    </div>

    <div
      class="result"
      id="resultText"
    ></div>

    <div class="footer">
      Press ENTER to submit faster ⚡
    </div>

  </div>

  <script>

    // ---------------- CONFIG ----------------

    const codeLengths = {

      easy: 5,
      intermediate: 7,
      hard: 10
    };

    const times = {

      easy: 5,
      intermediate: 3,
      hard: 1.5
    };

    const wordPools = {

      easy: [
        "flame",
        "crisp",
        "vivid",
        "shard",
        "lunar",
        "prism",
        "ember"
      ],

      intermediate: [
        "crystal",
        "shimmer",
        "radiant",
        "horizon",
        "spectra",
        "velvety",
        "amplify"
      ],

      hard: [
        "luminosity",
        "reflection",
        "stargazers",
        "afterglow",
        "resonating",
        "spellbound"
      ]
    };

    const chars =
      "abcdefghijklmnopqrstuvwxyz0123456789";

    // ---------------- STATE ----------------

    let currentAnswer = "";

    let currentTimer = null;

    let timeLeft = 0;

    let score = 0;

    let showingPhase = false;

    // ---------------- ELEMENTS ----------------

    const modeSelect =
      document.getElementById("modeSelect");

    const difficultySelect =
      document.getElementById("difficultySelect");

    const startBtn =
      document.getElementById("startBtn");

    const displayArea =
      document.getElementById("displayArea");

    const timerLabel =
      document.getElementById("timerLabel");

    const lengthLabel =
      document.getElementById("lengthLabel");

    const answerInput =
      document.getElementById("answerInput");

    const submitBtn =
      document.getElementById("submitBtn");

    const resultText =
      document.getElementById("resultText");

    const scoreText =
      document.getElementById("scoreText");

    // ---------------- HELPERS ----------------

    function randomFromArray(arr) {

      return arr[
        Math.floor(Math.random() * arr.length)
      ];
    }

    function generateCode(length) {

      let output = "";

      for (let i = 0; i < length; i++) {

        output += chars[
          Math.floor(Math.random() * chars.length)
        ];
      }

      return output;
    }

    function generateWord(difficulty) {

      return randomFromArray(
        wordPools[difficulty]
      );
    }

    function updateTimer() {

      timerLabel.textContent =
        `⏱ Time: ${timeLeft.toFixed(1)}s`;
    }

    function setTimer(seconds, onEnd) {

      clearInterval(currentTimer);

      timeLeft = seconds;

      updateTimer();

      currentTimer = setInterval(() => {

        timeLeft -= 0.1;

        if (timeLeft <= 0) {

          clearInterval(currentTimer);

          timerLabel.textContent =
            "⏱ Time: 0.0s";

          onEnd();

          return;
        }

        updateTimer();

      }, 100);
    }

    function resetUI() {

      answerInput.value = "";

      answerInput.disabled = true;

      submitBtn.disabled = true;

      resultText.textContent = "";

      resultText.className = "result";

      timerLabel.textContent =
        "⏱ Time: -";

      lengthLabel.textContent =
        "🔢 Length: -";
    }

    function setResult(message, type) {

      resultText.textContent = message;

      resultText.className =
        `result ${type}`;
    }

    // ---------------- GAME FLOW ----------------

    startBtn.addEventListener(
      "click",
      () => {

        resetUI();

        const mode =
          modeSelect.value;

        const difficulty =
          difficultySelect.value;

        const length =
          codeLengths[difficulty];

        const showTime =
          times[difficulty];

        let generated = "";

        if (mode === "code") {

          generated =
            generateCode(length);

        } else {

          generated =
            generateWord(difficulty);
        }

        currentAnswer = generated;

        showingPhase = true;

        displayArea.textContent =
          generated;

        lengthLabel.textContent =
          `🔢 Length: ${generated.length}`;

        resultText.textContent =
          "Memorise it carefully 👀";

        answerInput.disabled = true;

        submitBtn.disabled = true;

        setTimer(showTime, () => {

          displayArea.textContent =
            "•••••";

          showingPhase = false;

          answerInput.disabled = false;

          submitBtn.disabled = false;

          answerInput.focus();

          timerLabel.textContent =
            "⏱ Time: Done";

          resultText.textContent =
            "Type what you remember ✍️";
        });
      }
    );

    // ---------------- SUBMIT ----------------

    submitBtn.addEventListener(
      "click",
      () => {

        if (
          showingPhase ||
          !currentAnswer
        ) return;

        const userInput =
          answerInput.value.trim();

        if (!userInput) return;

        if (
          userInput.toLowerCase() ===
          currentAnswer.toLowerCase()
        ) {

          score += 100;

          scoreText.textContent =
            score;

          setResult(
            "✔️ Correct! +100 Points",
            "correct"
          );

        } else {

          setResult(
            `❌ Wrong! Answer: ${currentAnswer}`,
            "wrong"
          );
        }

        answerInput.disabled = true;

        submitBtn.disabled = true;
      }
    );

    // ---------------- ENTER KEY ----------------

    answerInput.addEventListener(
      "keydown",
      (e) => {

        if (e.key === "Enter") {

          submitBtn.click();
        }
      }
    );

  </script>

</body>
</html>
