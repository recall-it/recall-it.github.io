<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8" />

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>ReCall It!</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{

  --theme:#3b82f6;
  --theme-dark:#2563eb;

  --bg:#020617;
  --bg2:#0f172a;

  --card:rgba(15,23,42,.82);

  --text:#f8fafc;
  --muted:#94a3b8;

  --success:#22c55e;
  --danger:#ef4444;
}

body{

  min-height:100vh;

  background:
    radial-gradient(circle at top left,
    rgba(59,130,246,.15),
    transparent 25%),

    radial-gradient(circle at bottom right,
    rgba(139,92,246,.15),
    transparent 25%),

    linear-gradient(
      135deg,
      var(--bg),
      var(--bg2)
    );

  color:var(--text);

  font-family:
    Inter,
    system-ui,
    sans-serif;

  overflow-x:hidden;
}

/* =========================
   LOGIN MODAL
========================= */

.login-overlay{

  position:fixed;
  inset:0;

  backdrop-filter:blur(20px);

  background:
    rgba(0,0,0,.45);

  display:flex;
  justify-content:center;
  align-items:center;

  z-index:9999;
}

.login-modal{

  width:420px;

  background:
    rgba(15,23,42,.95);

  border:
    1px solid rgba(255,255,255,.08);

  border-radius:32px;

  padding:34px;

  box-shadow:
    0 30px 80px rgba(0,0,0,.45);

  animation:
    popup .35s ease;
}

@keyframes popup{

  from{
    opacity:0;
    transform:translateY(20px) scale(.95);
  }

  to{
    opacity:1;
    transform:none;
  }
}

.login-title{

  font-size:2.2rem;
  font-weight:900;

  margin-bottom:10px;
}

.login-sub{

  color:var(--muted);

  margin-bottom:28px;
}

.login-modal input{

  width:100%;

  margin-bottom:14px;

  padding:16px;

  border-radius:18px;

  border:
    1px solid rgba(255,255,255,.08);

  background:
    rgba(255,255,255,.05);

  color:white;

  outline:none;

  transition:.25s;
}

.login-modal input:focus{

  border-color:var(--theme);

  box-shadow:
    0 0 0 4px rgba(59,130,246,.15);
}

.login-btn{

  width:100%;

  padding:16px;

  border:none;

  border-radius:18px;

  background:var(--theme);

  color:white;

  font-weight:800;

  cursor:pointer;

  transition:.25s;
}

.login-btn:hover{

  transform:translateY(-2px);

  background:var(--theme-dark);
}

/* =========================
   APP
========================= */

.app{

  width:100%;
  max-width:1500px;

  margin:auto;

  min-height:100vh;

  display:grid;

  grid-template-columns:
    320px
    1fr
    240px;

  gap:24px;

  padding:28px;
}

/* =========================
   PANELS
========================= */

.panel{

  background:
    var(--card);

  border:
    1px solid rgba(255,255,255,.08);

  border-radius:32px;

  backdrop-filter:blur(20px);

  box-shadow:
    0 10px 40px rgba(0,0,0,.35);
}

/* =========================
   LEFT
========================= */

.left{

  padding:22px;

  display:flex;
  flex-direction:column;

  gap:22px;
}

.section-title{

  font-size:1.1rem;
  font-weight:800;

  margin-bottom:16px;
}

.leaderboard{

  display:flex;
  flex-direction:column;

  gap:12px;
}

.leaderboard-item{

  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:14px;

  border-radius:18px;

  background:
    rgba(255,255,255,.04);

  border:
    1px solid rgba(255,255,255,.04);
}

.lb-left{

  display:flex;
  align-items:center;

  gap:12px;
}

.rank{

  width:36px;
  height:36px;

  border-radius:12px;

  background:var(--theme);

  display:flex;
  justify-content:center;
  align-items:center;

  font-weight:800;
}

.party-input{

  display:flex;
  gap:10px;

  margin-bottom:16px;
}

.party-input input{

  flex:1;
}

.party-list{

  display:flex;
  flex-direction:column;
  gap:10px;
}

.party{

  padding:14px;

  border-radius:18px;

  background:
    rgba(255,255,255,.04);

  display:flex;
  justify-content:space-between;
  align-items:center;
}

/* =========================
   CENTER
========================= */

.center{

  padding:34px;

  position:relative;
}

.title{

  text-align:center;

  margin-bottom:34px;
}

.title h1{

  font-size:3rem;
  font-weight:900;

  letter-spacing:-2px;
}

.title p{

  color:var(--muted);

  margin-top:10px;
}

.score-box{

  position:absolute;

  top:28px;
  right:28px;

  width:120px;

  background:var(--theme);

  border-radius:24px;

  padding:18px;

  text-align:center;

  box-shadow:
    0 15px 30px rgba(0,0,0,.35);
}

.score-box span{

  display:block;

  font-size:.8rem;

  margin-bottom:6px;
}

.score-box strong{

  font-size:2rem;
}

.row{

  display:flex;

  gap:16px;

  margin-bottom:18px;
}

.field{
  flex:1;
}

.label{

  display:block;

  margin-bottom:8px;

  color:var(--muted);

  font-size:.9rem;
  font-weight:700;
}

select,
input{

  width:100%;

  padding:15px;

  border-radius:18px;

  border:
    1px solid rgba(255,255,255,.08);

  background:
    rgba(255,255,255,.05);

  color:white;

  outline:none;
}

select option{
  background:#111827;
}

.main-btn{

  width:100%;

  padding:17px;

  border:none;

  border-radius:22px;

  background:var(--theme);

  color:white;

  font-weight:800;

  cursor:pointer;

  transition:.25s;
}

.main-btn:hover{

  background:var(--theme-dark);

  transform:translateY(-2px);
}

.display{

  height:170px;

  margin-top:24px;

  border-radius:32px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.08),
      rgba(255,255,255,.03)
    );

  border:
    1px solid rgba(255,255,255,.08);

  display:flex;
  justify-content:center;
  align-items:center;

  font-size:2.6rem;
  font-weight:900;

  letter-spacing:4px;
}

.info{

  margin-top:18px;

  display:flex;
  justify-content:space-between;

  color:var(--muted);
}

.answer-row{

  display:flex;
  gap:12px;

  margin-top:20px;
}

.submit-btn{

  padding:0 26px;

  border:none;

  border-radius:18px;

  background:var(--theme);

  color:white;

  font-weight:800;

  cursor:pointer;
}

.result{

  margin-top:24px;

  text-align:center;

  min-height:24px;

  font-weight:800;
}

.correct{
  color:var(--success);
}

.wrong{
  color:var(--danger);
}

.footer{

  margin-top:28px;

  text-align:center;

  color:var(--muted);

  font-size:.85rem;
}

/* =========================
   RIGHT
========================= */

.right{

  padding:22px;

  display:flex;
  flex-direction:column;

  gap:18px;
}

.user-card{

  padding:18px;

  border-radius:24px;

  background:
    rgba(255,255,255,.04);

  text-align:center;
}

.user-avatar{

  width:70px;
  height:70px;

  border-radius:50%;

  background:var(--theme);

  display:flex;
  justify-content:center;
  align-items:center;

  margin:auto;

  font-size:1.8rem;
  font-weight:900;

  margin-bottom:14px;
}

.user-name{

  font-size:1.1rem;
  font-weight:800;
}

.user-email{

  margin-top:6px;

  color:var(--muted);

  font-size:.85rem;
}

.side-btn{

  width:100%;

  padding:14px;

  border:none;

  border-radius:18px;

  background:
    rgba(255,255,255,.06);

  color:white;

  cursor:pointer;

  font-weight:700;

  transition:.25s;
}

.side-btn:hover{

  transform:translateY(-2px);

  background:
    rgba(255,255,255,.1);
}

/* =========================
   THEME PICKER
========================= */

.theme-grid{

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:12px;
}

.theme{

  width:100%;
  aspect-ratio:1;

  border-radius:18px;

  cursor:pointer;

  border:
    3px solid transparent;

  transition:.25s;
}

.theme:hover{

  transform:scale(1.05);
}

.theme.active{

  border-color:white;
}

/* =========================
   BUTTON STATES
========================= */

button:disabled{

  opacity:.45;

  cursor:not-allowed;

  transform:none !important;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1200px){

  .app{

    grid-template-columns:1fr;
  }
}

@media(max-width:700px){

  .row{
    flex-direction:column;
  }

  .answer-row{
    flex-direction:column;
  }

  .score-box{

    position:static;

    margin-bottom:20px;
  }

  .title{
    text-align:left;
  }

  .title h1{
    font-size:2.2rem;
  }
}

</style>

</head>

<body>

<!-- =========================
     LOGIN MODAL
========================= -->

<div
  class="login-overlay"
  id="loginOverlay"
>

  <div class="login-modal">

    <div class="login-title">
      Welcome Back 👋
    </div>

    <div class="login-sub">
      Login to continue playing.
    </div>

    <input
      type="text"
      id="loginUsername"
      placeholder="Username"
    />

    <input
      type="email"
      id="loginEmail"
      placeholder="Email"
    />

    <input
      type="password"
      id="loginPassword"
      placeholder="Password"
    />

    <button
      class="login-btn"
      id="loginBtn"
    >
      Login
    </button>

  </div>

</div>

<!-- =========================
     APP
========================= -->

<div class="app">

  <!-- =========================
       LEFT PANEL
  ========================= -->

  <aside class="panel left">

    <div>

      <div class="section-title">
        🏆 Leaderboard
      </div>

      <div
        class="leaderboard"
        id="leaderboard"
      ></div>

    </div>

    <div>

      <div class="section-title">
        🎉 Multiplayer Rooms
      </div>

      <div class="party-input">

        <input
          type="text"
          id="roomInput"
          placeholder="Room name..."
        />

        <button
          class="main-btn"
          id="createRoomBtn"
        >
          +
        </button>

      </div>

      <div
        class="party-list"
        id="roomList"
      ></div>

    </div>

  </aside>

  <!-- =========================
       GAME PANEL
  ========================= -->

  <main class="panel center">

    <div class="score-box">

      <span>SCORE</span>

      <strong id="scoreText">
        0
      </strong>

    </div>

    <div class="title">

      <h1>
        🧠 ReCall It!
      </h1>

      <p>
        Ultimate Memory Challenge
      </p>

    </div>

    <div class="row">

      <div class="field">

        <label class="label">
          Mode
        </label>

        <select id="modeSelect">

          <option value="code">
            Random Code
          </option>

          <option value="words">
            Words
          </option>

        </select>

      </div>

      <div class="field">

        <label class="label">
          Difficulty
        </label>

        <select id="difficultySelect">

          <option value="easy">
            Easy
          </option>

          <option value="intermediate">
            Intermediate
          </option>

          <option value="hard">
            Hard
          </option>

        </select>

      </div>

    </div>

    <button
      class="main-btn"
      id="startBtn"
    >
      Start Challenge
    </button>

    <div
      class="display"
      id="displayArea"
    >
      Ready?
    </div>

    <div class="info">

      <span id="timerLabel">
        ⏱ Time: -
      </span>

      <span id="lengthLabel">
        🔢 Length: -
      </span>

    </div>

    <div class="answer-row">

      <input
        type="text"
        id="answerInput"
        placeholder="Type what you remember..."
        disabled
      />

      <button
        class="submit-btn"
        id="submitBtn"
        disabled
      >
        Submit
      </button>

    </div>

    <div
      class="result"
      id="resultText"
    ></div>

    <div class="footer">

      +1 point per correct answer ⚡

    </div>

  </main>

  <!-- =========================
       RIGHT PANEL
  ========================= -->

  <aside class="panel right">

    <div class="user-card">

      <div
        class="user-avatar"
        id="avatar"
      >
        G
      </div>

      <div
        class="user-name"
        id="usernameText"
      >
        Guest
      </div>

      <div
        class="user-email"
        id="emailText"
      >
        guest@example.com
      </div>

    </div>

    <button
      class="side-btn"
      id="dailyBtn"
    >
      🎁 Claim Daily +50
    </button>

    <button
      class="side-btn"
      id="logoutBtn"
    >
      🚪 Logout
    </button>

    <div>

      <div
        class="section-title"
        style="margin-bottom:14px;"
      >
        🎨 Themes
      </div>

      <div class="theme-grid">

        <div
          class="theme active"
          style="background:#ef4444"
          data-theme="#ef4444"
        ></div>

        <div
          class="theme"
          style="background:#f97316"
          data-theme="#f97316"
        ></div>

        <div
          class="theme"
          style="background:#eab308"
          data-theme="#eab308"
        ></div>

        <div
          class="theme"
          style="background:#84cc16"
          data-theme="#84cc16"
        ></div>

        <div
          class="theme"
          style="background:#22c55e"
          data-theme="#22c55e"
        ></div>

        <div
          class="theme"
          style="background:#06b6d4"
          data-theme="#06b6d4"
        ></div>

        <div
          class="theme"
          style="background:#38bdf8"
          data-theme="#38bdf8"
        ></div>

        <div
          class="theme"
          style="background:#3b82f6"
          data-theme="#3b82f6"
        ></div>

        <div
          class="theme"
          style="background:#8b5cf6"
          data-theme="#8b5cf6"
        ></div>

        <div
          class="theme"
          style="background:#d946ef"
          data-theme="#d946ef"
        ></div>

        <div
          class="theme"
          style="background:#ec4899"
          data-theme="#ec4899"
        ></div>

      </div>

    </div>

  </aside>

</div>

<script>

/* =========================
   CONFIG
========================= */

const codeLengths={

  easy:5,
  intermediate:7,
  hard:10
};

const times={

  easy:5,
  intermediate:3,
  hard:1.5
};

const wordPools={

  easy:[
    "flame",
    "crisp",
    "vivid",
    "ember",
    "lunar"
  ],

  intermediate:[
    "crystal",
    "horizon",
    "shimmer",
    "spectra"
  ],

  hard:[
    "luminosity",
    "reflection",
    "spellbound",
    "afterglow"
  ]
};

const chars=
"abcdefghijklmnopqrstuvwxyz0123456789";

/* =========================
   STATE
========================= */

let currentAnswer="";
let currentTimer=null;
let timeLeft=0;
let score=0;
let showingPhase=false;

/* =========================
   ELEMENTS
========================= */

const loginOverlay=
document.getElementById("loginOverlay");

const loginBtn=
document.getElementById("loginBtn");

const usernameText=
document.getElementById("usernameText");

const emailText=
document.getElementById("emailText");

const avatar=
document.getElementById("avatar");

const scoreText=
document.getElementById("scoreText");

const displayArea=
document.getElementById("displayArea");

const timerLabel=
document.getElementById("timerLabel");

const lengthLabel=
document.getElementById("lengthLabel");

const answerInput=
document.getElementById("answerInput");

const submitBtn=
document.getElementById("submitBtn");

const resultText=
document.getElementById("resultText");

const startBtn=
document.getElementById("startBtn");

const modeSelect=
document.getElementById("modeSelect");

const difficultySelect=
document.getElementById("difficultySelect");

/* =========================
   LOGIN
========================= */

function loadUser(){

  const user=
    JSON.parse(
      localStorage.getItem("recall-user")
    );

  if(!user)return;

  usernameText.textContent=
    user.username;

  emailText.textContent=
    user.email;

  avatar.textContent=
    user.username[0]
    .toUpperCase();

  loginOverlay.style.display=
    "none";
}

loginBtn.addEventListener(
"click",
()=>{

  const username=
    document
    .getElementById(
      "loginUsername"
    )
    .value
    .trim();

  const email=
    document
    .getElementById(
      "loginEmail"
    )
    .value
    .trim();

  const password=
    document
    .getElementById(
      "loginPassword"
    )
    .value
    .trim();

  if(
    !username ||
    !email ||
    !password
  ) return;

  localStorage.setItem(
    "recall-user",

    JSON.stringify({

      username,
      email,
      password
    })
  );

  loadUser();
});

/* =========================
   LEADERBOARD
========================= */

function saveLeaderboard(){

  const user=
    JSON.parse(
      localStorage.getItem("recall-user")
    );

  if(!user)return;

  let leaderboard=
    JSON.parse(
      localStorage.getItem(
        "recall-leaderboard"
      )
    ) || [];

  const existing=
    leaderboard.find(
      p=>p.username===user.username
    );

  if(existing){

    existing.score=score;

  }else{

    leaderboard.push({

      username:user.username,
      score
    });
  }

  leaderboard.sort(
    (a,b)=>
      b.score-a.score
  );

  localStorage.setItem(

    "recall-leaderboard",

    JSON.stringify(leaderboard)
  );

  renderLeaderboard();
}

function renderLeaderboard(){

  const leaderboard=
    JSON.parse(
      localStorage.getItem(
        "recall-leaderboard"
      )
    ) || [];

  const container=
    document.getElementById(
      "leaderboard"
    );

  container.innerHTML="";

  leaderboard
  .slice(0,10)
  .forEach((player,index)=>{

    container.innerHTML+=`

      <div class="leaderboard-item">

        <div class="lb-left">

          <div class="rank">
            ${index+1}
          </div>

          <div>
            ${player.username}
          </div>

        </div>

        <div>
          ${player.score}
        </div>

      </div>

    `;
  });
}

/* =========================
   DAILY REWARD
========================= */

document
.getElementById("dailyBtn")
.addEventListener(
"click",
()=>{

  const today=
    new Date()
    .toDateString();

  const claimed=
    localStorage.getItem(
      "daily-reward"
    );

  if(today===claimed){

    alert(
      "Already claimed today!"
    );

    return;
  }

  score+=50;

  scoreText.textContent=score;

  localStorage.setItem(
    "daily-reward",
    today
  );

  saveLeaderboard();

  alert(
    "+50 points claimed!"
  );
});

/* =========================
   ROOMS
========================= */

function renderRooms(){

  const rooms=
    JSON.parse(
      localStorage.getItem(
        "recall-rooms"
      )
    ) || [];

  const roomList=
    document.getElementById(
      "roomList"
    );

  roomList.innerHTML="";

  rooms.forEach(room=>{

    roomList.innerHTML+=`

      <div class="party">

        <span>
          🎮 ${room}
        </span>

        <button
          class="submit-btn"
        >
          Join
        </button>

      </div>

    `;
  });
}

document
.getElementById("createRoomBtn")
.addEventListener(
"click",
()=>{

  const input=
    document.getElementById(
      "roomInput"
    );

  const value=
    input.value.trim();

  if(!value)return;

  let rooms=
    JSON.parse(
      localStorage.getItem(
        "recall-rooms"
      )
    ) || [];

  rooms.push(value);

  localStorage.setItem(
    "recall-rooms",
    JSON.stringify(rooms)
  );

  input.value="";

  renderRooms();
});

/* =========================
   HELPERS
========================= */

function randomFromArray(arr){

  return arr[
    Math.floor(
      Math.random()*arr.length
    )
  ];
}

function generateCode(length){

  let out="";

  for(let i=0;i<length;i++){

    out+=chars[
      Math.floor(
        Math.random()*chars.length
      )
    ];
  }

  return out;
}

function generateWord(difficulty){

  return randomFromArray(
    wordPools[difficulty]
  );
}

function updateTimer(){

  timerLabel.textContent=
  `⏱ Time: ${timeLeft.toFixed(1)}s`;
}

function setTimer(seconds,onEnd){

  clearInterval(currentTimer);

  timeLeft=seconds;

  updateTimer();

  currentTimer=setInterval(()=>{

    timeLeft-=0.1;

    if(timeLeft<=0){

      clearInterval(currentTimer);

      onEnd();

      return;
    }

    updateTimer();

  },100);
}

/* =========================
   GAME
========================= */

startBtn.addEventListener(
"click",
()=>{

  const mode=
    modeSelect.value;

  const difficulty=
    difficultySelect.value;

  const length=
    codeLengths[difficulty];

  const showTime=
    times[difficulty];

  let generated="";

  if(mode==="code"){

    generated=
      generateCode(length);

  }else{

    generated=
      generateWord(difficulty);
  }

  currentAnswer=generated;

  showingPhase=true;

  displayArea.textContent=
    generated;

  lengthLabel.textContent=
    `🔢 Length: ${generated.length}`;

  resultText.textContent=
    "Memorise it 👀";

  answerInput.value="";

  answerInput.disabled=true;

  submitBtn.disabled=true;

  setTimer(showTime,()=>{

    displayArea.textContent=
      "•••••";

    showingPhase=false;

    answerInput.disabled=false;

    submitBtn.disabled=false;

    answerInput.focus();

    timerLabel.textContent=
      "⏱ Done";

    resultText.textContent=
      "Type it ✍️";
  });
});

/* =========================
   SUBMIT
========================= */

submitBtn.addEventListener(
"click",
()=>{

  if(
    showingPhase ||
    !currentAnswer
  ) return;

  const userInput=
    answerInput.value.trim();

  if(!userInput)return;

  if(

    userInput.toLowerCase()===

    currentAnswer.toLowerCase()
  ){

    score+=1;

    scoreText.textContent=
      score;

    resultText.textContent=
      "✔ Correct!";

    resultText.className=
      "result correct";

    saveLeaderboard();

  }else{

    resultText.textContent=
      `❌ ${currentAnswer}`;

    resultText.className=
      "result wrong";
  }

  answerInput.disabled=true;

  submitBtn.disabled=true;
});

/* =========================
   ENTER
========================= */

answerInput.addEventListener(
"keydown",
e=>{

  if(e.key==="Enter"){

    submitBtn.click();
  }
});

/* =========================
   LOGOUT
========================= */

document
.getElementById("logoutBtn")
.addEventListener(
"click",
()=>{

  localStorage.removeItem(
    "recall-user"
  );

  location.reload();
});

/* =========================
   THEMES
========================= */

document
.querySelectorAll(".theme")
.forEach(theme=>{

  theme.addEventListener(
  "click",
  ()=>{

    document
    .querySelectorAll(".theme")
    .forEach(t=>
      t.classList.remove("active")
    );

    theme.classList.add(
      "active"
    );

    const color=
      theme.dataset.theme;

    document.documentElement
    .style.setProperty(
      "--theme",
      color
    );
  });
});

/* =========================
   INIT
========================= */

loadUser();

renderLeaderboard();

renderRooms();

</script>

</body>
</html>
